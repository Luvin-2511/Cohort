<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="shortcut icon" href="./greeen.png" type="image/x-icon">
</head>

<body>
    <main>
        <div class="lefttop">
            <img class="logo" src="https://ashish-bhatti.github.io/Juice-gsap/img/logo.png" alt="">
        </div>
        <div class="leftcenter">
            <h1>Pure Taste</h1>
            <h3>Crafted from nature's best, every bottle is a blend of pure ingredients and vibrant flavours. Designed
                to refresh your body, uplift your mind. A little moment of joy in every sip.</h3>
        </div>
        <div class="leftbottom">
            <div class="logos">
                <div class="logo">
                    <i class="ri-instagram-line"></i>
                </div>
                <div class="logo">
                    <i class="ri-facebook-circle-fill"></i>
                </div>
                <div class="logo">
                    <i class="ri-bluesky-fill"></i>
                </div>
                <div class="logo">
                    <i class="ri-twitter-x-line"></i>
                </div>
            </div>
        </div>
        <div class="center">
            <div class="cont">
                <div class="text">Ju-cy</div>
                <div class="image"><img src="greeen.png" alt=""></div>
            </div>
            <div class="cont">
                <div class="text">Be-ry</div>
                <div class="image"><img src="red.png" alt=""></div>
            </div>
            <div class="cont">
                <div class="text">Ze-st</div>
                <div class="image"><img src="yellow.png" alt=""></div>
            </div>
            <div class="cont">
                <div class="text">Pu-re</div>
                <div class="image"><img src="purple.png" alt=""></div>
            </div>
        </div>
        <div class="lasttop">
            <ul>
                <li>Home</li>
                <li>Products</li>
                <li>Contact</li>
                <li><button>Place order ></button></li>
            </ul>
        </div>
        <div class="lastcenter">
            <h2> Cucumber Flavor</h2>
            <div class="circles">
                <div class="circle">500ml</div>
                <div class="circle">300ml</div>
                <div class="circle">100ml</div>
            </div>

        </div>
        <div class="lastbottom">
            <button>Import Template ></button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
