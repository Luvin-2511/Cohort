<!DOCTYPE html>
<html>
<head>
  <title>Save to Second Brain</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #333;
    }
    p {
      color: #666;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #000;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #333;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      text-align: center;
      color: green;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Second Brain</h3>
  <p>Save this page to your collections.</p>
  <button id="saveBtn">Save Current Page</button>
  <div id="status">Saved successfully!</div>
  
  <script src="popup.js"></script>
</body>
</html>
