<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login page</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="lamp">
        <div class="top"></div>
        <div class="danda"></div>
        <div class="bottom"></div>
        <div class="string">
          <svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M 10 80 Q 120 80 160 80"
              stroke="white"
              stroke-width="5"
              fill="transparent"
            />
          </svg>
        </div>
      </div>

      <div class="bg-light"></div>
      <div class="round-light"></div>

      <div class="form-container">
        <form>
          <div class="form-header">
            <h2>Welcome back</h2>
            <p>Sign in to continue</p>
          </div>

          <div class="ornament"><span class="ornament-dot"></span></div>

          <div class="input-group">
            <label for="username">Username</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <circle cx="8" cy="5.5" r="2.8"/>
                <path d="M2 13.5c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>
              </svg>
              <input id="username" type="text" placeholder="Enter your username" autocomplete="username" required />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="3" y="7" width="10" height="7.5" rx="1.4"/>
                <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>
                <circle cx="8" cy="11" r="0.9" fill="currentColor" stroke="none"/>
              </svg>
              <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <div class="forgot-row"><a href="#">Forgot password?</a></div>

          <button class="btn-submit" type="submit">Login</button>

          <p class="form-footer">No account? <a href="#">Create one</a></p>
        </form>
      </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/AttrPlugin.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
